name: Post-Scrape Enrichment

# Runs Claude Haiku LLM enrichment on newly scraped COLAs.
# Dispatched by Post-Scrape OCR with a matching limit, or manually.
# Final step in the chain: Daily TTB Sync → Images → OCR → Enrichment

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max COLAs to enrich'
        required: false
        default: '1000'
        type: string
      dry_run:
        description: 'Dry run (no D1 writes)'
        required: false
        default: false
        type: boolean

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data logs

      - name: Run LLM enrichment on new COLAs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LIMIT="${{ inputs.limit || '1000' }}"
          DRY_RUN="${{ inputs.dry_run }}"

          FLAGS="--limit $LIMIT"
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          cd scripts
          echo "Running: python run_enrichment.py $FLAGS"
          python run_enrichment.py $FLAGS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
