name: Post-Scrape OCR

# Runs Google Cloud Vision OCR on newly downloaded label images.
# Dispatched by Post-Scrape Images with a matching limit, or manually.
# On completion, dispatches Post-Scrape Enrichment with the same limit.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max images to OCR'
        required: false
        default: '1000'
        type: string
      dry_run:
        description: 'Dry run (no D1 writes)'
        required: false
        default: false
        type: boolean

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data logs

      - name: Setup GCP credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-service-account.json" >> $GITHUB_ENV

      - name: Run OCR on new images
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          LIMIT="${{ inputs.limit || '1000' }}"
          DRY_RUN="${{ inputs.dry_run }}"

          FLAGS="--limit $LIMIT"
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          cd scripts
          echo "Running: python run_ocr.py $FLAGS"
          python run_ocr.py $FLAGS

      - name: Cleanup GCP credentials
        if: always()
        run: rm -f /tmp/gcp-service-account.json

      - name: Trigger Enrichment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIMIT="${{ inputs.limit || '1000' }}"
          echo "Dispatching Post-Scrape Enrichment with limit=$LIMIT"
          gh workflow run "Post-Scrape Enrichment" -f limit="$LIMIT"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
