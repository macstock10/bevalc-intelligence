name: Post-Scrape Images

# Downloads label images from TTB for newly scraped COLAs.
# Dispatched by Daily TTB Sync with the exact count of new COLAs, or manually.
# On completion, dispatches Post-Scrape OCR with the same limit.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max COLAs to download images for'
        required: false
        default: '1000'
        type: string
      dry_run:
        description: 'Dry run (no R2 writes)'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data logs

      - name: Download label images from TTB
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          LIMIT="${{ inputs.limit || '1000' }}"
          DRY_RUN="${{ inputs.dry_run }}"

          FLAGS="--limit $LIMIT --workers 3"
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          cd scripts
          echo "Running: python backfill_images.py $FLAGS"
          python backfill_images.py $FLAGS

      - name: Trigger OCR workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIMIT="${{ inputs.limit || '1000' }}"
          echo "Dispatching Post-Scrape OCR with limit=$LIMIT"
          gh workflow run "Post-Scrape OCR" -f limit="$LIMIT"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-logs-${{ github.run_number }}
          path: |
            logs/
            data/backfill_images_checkpoint.txt
          retention-days: 14
          if-no-files-found: ignore
