name: SEC RAG Sync

# Syncs SEC filings to OpenAI vector store for RAG queries.
# Daily incremental sync for new filings.
# Manual backfill for historical data.

on:
  schedule:
    # Run daily at 6am UTC = 1am ET
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental    # Last 7 days
          - backfill       # Full historical backfill
          - clear          # Clear vector store and re-sync
      ticker:
        description: 'Company ticker (optional, for single company)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip upload to vector store)'
        required: false
        default: false
        type: boolean

jobs:
  sync-filings:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts/sec-rag
          npm install

      - name: Create directories
        run: |
          mkdir -p data logs

      - name: Run incremental sync
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'incremental' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd scripts/sec-rag
          echo "Running incremental sync (last 7 days)"
          TICKER_FLAG=""
          if [ -n "${{ inputs.ticker }}" ]; then
            TICKER_FLAG="--ticker ${{ inputs.ticker }}"
          fi
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          npx tsx ingest.ts --incremental $TICKER_FLAG $DRY_RUN_FLAG

      - name: Run backfill
        if: ${{ inputs.mode == 'backfill' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd scripts/sec-rag
          echo "Running full backfill"
          TICKER_FLAG=""
          if [ -n "${{ inputs.ticker }}" ]; then
            TICKER_FLAG="--ticker ${{ inputs.ticker }}"
          fi
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          npx tsx ingest.ts --backfill $TICKER_FLAG $DRY_RUN_FLAG

      - name: Run clear and re-sync
        if: ${{ inputs.mode == 'clear' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd scripts/sec-rag
          echo "Clearing vector store and re-syncing"
          TICKER_FLAG=""
          if [ -n "${{ inputs.ticker }}" ]; then
            TICKER_FLAG="--ticker ${{ inputs.ticker }}"
          fi
          npx tsx ingest.ts --clear --backfill $TICKER_FLAG

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-rag-sync-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
