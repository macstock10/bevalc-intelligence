name: Daily TTB Sync

# Scrapes a rolling 7-day window each day at 9pm ET (2am UTC).
# Exports new COLAs to JSON files in local-browser/daily_sync/ and commits them.
# NO writes to Cloudflare D1 — all data stays local via git pull + merge-daily.py.

on:
  schedule:
    # Run at 2am UTC = 9pm ET (winter) / 10pm ET (summer)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to look back (default: 7)'
        required: false
        default: '7'
        type: string
      dry_run:
        description: 'Dry run (scrape but skip export)'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          firefox --version

      - name: Install Python dependencies
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data logs local-browser/daily_sync

      - name: Run daily sync (7-day rolling window)
        env:
          # NO Cloudflare credentials — D1 sync is permanently disabled.
          # Data flows: scrape TTB → JSON export → git commit → local merge-daily.py
          MOZ_HEADLESS: "1"
          DISPLAY: ":99"
        run: |
          cd scripts

          DAYS="${{ inputs.days || '7' }}"
          echo "Scraping last ${DAYS} days"

          # Start virtual display for Firefox
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python weekly_update.py --days $DAYS --dry-run
          else
            python weekly_update.py --days $DAYS
          fi

      - name: Commit new COLA data for local sync
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          COUNT=$(cat data/sync_inserted_count.txt 2>/dev/null || echo "0")
          echo "New COLAs scraped: $COUNT"

          if [ "$COUNT" -gt 0 ] && ls local-browser/daily_sync/*.json 1>/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add local-browser/daily_sync/*.json
            git diff --cached --quiet || git commit -m "Daily sync: ${COUNT} new COLAs $(date -u +%Y-%m-%d)"
            git push
            echo "Committed ${COUNT} new COLAs to local-browser/daily_sync/"
          else
            echo "No new COLA data to commit (count: ${COUNT})"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sync-logs-${{ github.run_number }}
          path: logs/weekly_update.log
          retention-days: 14
